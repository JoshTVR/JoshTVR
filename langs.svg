<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
  <defs>
    <style>
      @keyframes spin { to { stroke-dashoffset: -471; } }
      .ring { animation: spin 2s linear infinite; }
    </style>
    <pattern id="gl" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#21262d"/>
    </pattern>
  </defs>
  <rect width="300" height="360" rx="12" fill="#0d1117"/>
  <rect width="300" height="360" rx="12" fill="url(#gl)"/>
  <text x="150" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#3d444d" letter-spacing="4">LANGUAGES</text>
  <circle cx="150" cy="175" r="75" fill="none" stroke="#161b22" stroke-width="28"/>
  <circle cx="150" cy="175" r="75" fill="none" stroke="#7c3aed" stroke-width="26"
    stroke-dasharray="120 351" stroke-dashoffset="0" transform="rotate(-90 150 175)" opacity=".6" class="ring"/>
  <text x="150" y="168" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#484f58">loading</text>
  <text x="150" y="186" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#3d444d">run workflow</text>
</svg>
