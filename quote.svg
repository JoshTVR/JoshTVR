<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 100">
  <defs>
    <style>
      @keyframes accentGlow { 0%,100%{opacity:.5} 50%{opacity:1} }
      @keyframes fadeIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
      .accent { animation: accentGlow 3s ease-in-out infinite; }
      .line1  { animation: fadeIn .6s ease-out both; animation-delay:.2s; }
      .line2  { animation: fadeIn .6s ease-out both; animation-delay:.8s; }
      .line3  { animation: fadeIn .6s ease-out both; animation-delay:1.4s; }
    </style>
    <pattern id="g" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#21262d"/>
    </pattern>
  </defs>

  <rect width="840" height="100" rx="12" fill="#0d1117"/>
  <rect width="840" height="100" rx="12" fill="url(#g)"/>

  <!-- Left accent bar -->
  <rect x="28" y="18" width="3" height="64" rx="1.5" fill="#7c3aed" class="accent"/>

  <!-- Quote marks -->
  <text x="44" y="38" font-family="'Courier New',monospace" font-size="28" fill="#7c3aed" opacity=".3">"</text>

  <!-- Quote lines -->
  <text x="48" y="42" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9" class="line1">I used to build virtual worlds. Now I build data pipelines.</text>
  <text x="48" y="62" font-family="'Courier New',monospace" font-size="13" fill="#8b949e" class="line2">The obsession with clean systems never changed.</text>
</svg>
