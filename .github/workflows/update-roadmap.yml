name: Update Roadmap

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# ── Edit these when you pass a cert ──────────────────────────────────────────
env:
  AWS_CCP_DONE:  'false'
  SNOWPRO_DONE:  'false'
  AWS_DE_DONE:   'false'
  SQL_TARGET:    '5'
  PYTHON_TARGET: '14'
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch commit counts from data-engineering-journey
        id: counts
        run: |
          SQL=$(curl -s "https://api.github.com/repos/JoshTVR/data-engineering-journey/commits?path=SQL&per_page=100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)")
          PYTHON=$(curl -s "https://api.github.com/repos/JoshTVR/data-engineering-journey/commits?path=Python&per_page=100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)")
          echo "sql=$SQL" >> $GITHUB_OUTPUT
          echo "python=$PYTHON" >> $GITHUB_OUTPUT

      - name: Generate roadmap.svg
        env:
          SQL_COMMITS:    ${{ steps.counts.outputs.sql }}
          PYTHON_COMMITS: ${{ steps.counts.outputs.python }}
        run: |
          python3 - << 'PYEOF'
          import os, math

          sql     = int(os.environ.get('SQL_COMMITS', '0'))
          python  = int(os.environ.get('PYTHON_COMMITS', '0'))
          ccp     = os.environ.get('AWS_CCP_DONE', 'false').lower() == 'true'
          snow    = os.environ.get('SNOWPRO_DONE', 'false').lower() == 'true'
          aws_de  = os.environ.get('AWS_DE_DONE', 'false').lower() == 'true'
          sql_t   = int(os.environ.get('SQL_TARGET', '5'))
          py_t    = int(os.environ.get('PYTHON_TARGET', '14'))

          stages = [
            ("SQL Fundamentals",       min(sql / sql_t, 1.0),   "#f59e0b"),
            ("Python Fundamentals",    min(python / py_t, 1.0), "#3776ab"),
            ("AWS Cloud Practitioner", 1.0 if ccp   else 0.0,   "#ff9900"),
            ("Snowflake Core",         1.0 if snow  else 0.0,   "#29b5e8"),
            ("AWS DE Associate",       1.0 if aws_de else 0.0,  "#7c3aed"),
          ]

          W, H = 840, 232
          BAR_X, BAR_W, BAR_H = 228, 462, 14
          LABEL_X, START_Y, ROW_SPACING = 20, 52, 38

          rows = ""
          for i, (label, progress, color) in enumerate(stages):
            y    = START_Y + i * ROW_SPACING
            pct  = int(progress * 100)
            fw   = int(BAR_W * progress)
            if pct == 100:  status, sc = "DONE",        "#34d399"
            elif pct > 0:   status, sc = "IN PROGRESS", color
            else:           status, sc = "UPCOMING",    "#3d444d"
            fill = f'<rect x="{BAR_X}" y="{y}" width="{fw}" height="{BAR_H}" rx="7" fill="{color}" opacity=".85"/>' if fw > 0 else ''
            rows += f'''
            <text x="{LABEL_X}" y="{y+11}" font-family="'Courier New',monospace" font-size="11" fill="#8b949e">{label}</text>
            <rect x="{BAR_X}" y="{y}" width="{BAR_W}" height="{BAR_H}" rx="7" fill="#161b22"/>
            {fill}
            <text x="{BAR_X+BAR_W+14}" y="{y+11}" font-family="'Courier New',monospace" font-size="10" fill="{color}">{pct}%</text>
            <text x="{BAR_X+BAR_W+58}" y="{y+11}" font-family="'Courier New',monospace" font-size="9" fill="{sc}">{status}</text>
          '''

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}">
            <defs>
              <pattern id="g" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r=".8" fill="#21262d"/>
              </pattern>
            </defs>
            <rect width="{W}" height="{H}" rx="12" fill="#0d1117"/>
            <rect width="{W}" height="{H}" rx="12" fill="url(#g)"/>
            <text x="420" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#3d444d" letter-spacing="4">DE ROADMAP</text>
            <line x1="20" y1="32" x2="{W-20}" y2="32" stroke="#21262d" stroke-width="1"/>
            {rows}
          </svg>'''

          with open('roadmap.svg', 'w') as f:
            f.write(svg)
          print(f"roadmap.svg generated — SQL:{sql}/{sql_t} Python:{python}/{py_t} CCP:{ccp} Snow:{snow} DE:{aws_de}")
          PYEOF

      - name: Generate langs.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, math, json, urllib.request

          token = os.environ.get('GH_TOKEN', '')

          def fetch(url):
            req = urllib.request.Request(url, headers={
              "User-Agent": "roadmap-action",
              "Authorization": f"Bearer {token}" if token else "",
            })
            with urllib.request.urlopen(req) as r:
              return json.load(r)

          repos = fetch("https://api.github.com/users/JoshTVR/repos?per_page=100&type=owner")
          public = [r for r in repos if not r.get("fork") and not r.get("private")]

          lang_bytes = {}
          for repo in public:
            try:
              langs = fetch(f"https://api.github.com/repos/JoshTVR/{repo['name']}/languages")
              for lang, b in langs.items():
                lang_bytes[lang] = lang_bytes.get(lang, 0) + b
            except:
              pass

          top = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:6]
          total = sum(b for _, b in top) or 1

          COLORS = {
            "TypeScript": "#3178c6", "Python": "#3776ab", "JavaScript": "#f1e05a",
            "CSS": "#563d7c", "HTML": "#e34c26", "C#": "#178600",
            "SQL": "#f59e0b", "HLSL": "#7c3aed", "ShaderLab": "#4f46e5",
            "MDX": "#29b5e8", "Dockerfile": "#2496ed", "Shell": "#89e051",
          }
          FALLBACK = ["#7c3aed", "#4f46e5", "#2563eb", "#29b5e8", "#34d399", "#f59e0b"]

          R, CX, CY = 75, 150, 125
          CIRC = 2 * math.pi * R
          GAP = 4
          W, H = 300, 280

          segs = []
          cum = 0
          for i, (lang, b) in enumerate(top):
            pct = b / total
            dash = max(pct * CIRC - GAP, 0)
            color = COLORS.get(lang, FALLBACK[i % len(FALLBACK)])
            segs.append((lang, pct, dash, cum, color))
            cum += pct * CIRC

          seg_svg = ""
          for lang, pct, dash, start, color in segs:
            seg_svg += f'<circle cx="{CX}" cy="{CY}" r="{R}" fill="none" stroke="{color}" stroke-width="26" stroke-dasharray="{dash:.2f} {CIRC:.2f}" stroke-dashoffset="{-start:.2f}" transform="rotate(-90 {CX} {CY})" opacity=".9"/>\n'

          legend_svg = ""
          for i, (lang, pct, _, _, color) in enumerate(segs):
            col = i % 2
            row = i // 2
            lx = 24 + col * 142
            ly = 222 + row * 20
            legend_svg += f'<circle cx="{lx+5}" cy="{ly-4}" r="4" fill="{color}"/>\n'
            legend_svg += f'<text x="{lx+14}" y="{ly}" font-family="\'Courier New\',monospace" font-size="10" fill="#8b949e">{lang} <tspan fill="{color}">{pct*100:.1f}%</tspan></text>\n'

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}">
            <defs>
              <pattern id="gl" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r=".8" fill="#21262d"/>
              </pattern>
            </defs>
            <rect width="{W}" height="{H}" rx="12" fill="#0d1117"/>
            <rect width="{W}" height="{H}" rx="12" fill="url(#gl)"/>
            <text x="{W//2}" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#3d444d" letter-spacing="4">LANGUAGES</text>
            <circle cx="{CX}" cy="{CY}" r="{R}" fill="none" stroke="#161b22" stroke-width="28"/>
            {seg_svg}
            <text x="{CX}" y="{CY-10}" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#484f58">repos</text>
            <text x="{CX}" y="{CY+14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="24" font-weight="bold" fill="#8b949e">{len(public)}</text>
            {legend_svg}
          </svg>"""

          with open('langs.svg', 'w') as f:
            f.write(svg)
          print(f"langs.svg generated — {[l for l,_ in top]}")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roadmap.svg langs.svg
          git diff --staged --quiet || (git commit -m "chore: update roadmap and language stats" && git push)